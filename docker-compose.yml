services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webgis}
      POSTGRES_USER: ${POSTGRES_USER:-webgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webgis} -d ${POSTGRES_DB:-webgis}"]
      interval: 10s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - "--listen-addresses"
      - "0.0.0.0:3000"
      - "postgresql://${POSTGRES_USER:-webgis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-webgis}"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webgis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-webgis}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./data:/data

  titiler:
    image: ghcr.io/developmentseed/titiler:2.4.0
    restart: unless-stopped
    command: ["uvicorn","titiler.application.main:app","--host","0.0.0.0","--port","8000","--workers","1"]
    volumes:
      - ./data/rasters:/data/rasters:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - martin
      - api
      - titiler
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgis_data:
  caddy_data:
  caddy_config:
