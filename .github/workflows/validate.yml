name: Validate WebGIS

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check frontend/bootstrap.js
          node --check frontend/app.js
          node --check frontend/field-mode.js
          node --check frontend/config.js
          node --check frontend/sw.js

      - name: Check shell syntax
        run: |
          bash -n ops/vendor-maplibre.sh
          bash -n ops/deploy.sh
          bash -n ops/deploy-external-caddy.sh

      - name: Ensure MapLibre is self-hosted
        run: |
          if grep -R -E 'cdn\.jsdelivr\.net/.+maplibre|unpkg\.com/.+maplibre' frontend/index.html frontend/*.js; then
            echo "External MapLibre CDN reference found"
            exit 1
          fi

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py backend/import_gis.py

      - name: Validate Docker Compose
        env:
          DOMAIN: gis.example.com
          POSTGRES_DB: webgis
          POSTGRES_USER: webgis
          POSTGRES_PASSWORD: ci_only_password
          CORS_ORIGINS: https://gis.example.com
        run: docker compose config --quiet
